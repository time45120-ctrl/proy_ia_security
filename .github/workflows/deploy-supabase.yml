name: Deploy Supabase to production

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy migrations and Edge Functions
    if: vars.SUPABASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Configure SUPABASE_ACCESS_TOKEN in the production environment secrets}"
          : "${SUPABASE_DB_PASSWORD:?Configure SUPABASE_DB_PASSWORD in the production environment secrets}"
          : "${SUPABASE_PROJECT_REF:?Configure SUPABASE_PROJECT_REF as a repository variable}"
          test "${SUPABASE_PROJECT_REF}" = "omkbowrspgbuwpifksfk"

      - name: Checkout Supabase source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI 2.109.1
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.109.1

      - name: Link authorized project
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Preview database migrations
        run: supabase db push --dry-run

      - name: Apply pending database migrations
        run: supabase db push

      - name: Deploy all Edge Functions through the Management API
        run: supabase functions deploy --use-api --project-ref "${SUPABASE_PROJECT_REF}"
